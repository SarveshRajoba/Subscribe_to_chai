name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only needs write access to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Build (production = in-browser demo mode)
        run: npx ng build --configuration production --base-href /Subscribe_to_chai/
        working-directory: mobile

      # SPA + Jekyll housekeeping for GitHub Pages:
      # - .nojekyll stops Pages from ignoring files, so all assets serve.
      # - 404.html = index.html so deep links resolve to the app.
      - name: Prepare Pages output
        run: |
          touch mobile/www/.nojekyll
          cp mobile/www/index.html mobile/www/404.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile/www
          force_orphan: true
